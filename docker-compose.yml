
services:
  postgres:
    image: postgres:16
    container_name: estoque-db
    env_file: ./db/.env
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./node-estoque
    container_name: estoque-api
    restart: unless-stopped
    env_file: ./node-estoque/.env
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    build: ./vue-estoque
    container_name: estoque-web
    restart: unless-stopped
    ports:
      - "4173:8000"
    depends_on:
      - backend

volumes:
  pgdata: